name: CI

on:
  push:
    # `release/**` is here because the `semver compatibility` job below is the only
    # thing enforcing the API freeze, and a release branch that never runs CI defers
    # that check until after the merge — which is after the decision it exists to
    # inform. Noticed on `release/1.0.1`, the first patch release under the freeze:
    # the branch was pushed and nothing ran.
    branches: [main, "feat/**", "release/**"]
  pull_request:
  workflow_dispatch:

# §18.4: least privilege. No job here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # A workflow that does not parse fails with no line number and only after a
  # push, so this runs first and says exactly which file and line is wrong.
  workflows:
    name: workflow files parse
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 .github/scripts/check_workflows.py

  # Formatting is cheap and unambiguous, so it gates the expensive jobs.
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.name }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: macos-arm64
            runner: macos-15
          # §4 lists macOS x86_64 as Tier 1. GitHub's Intel macOS runners are
          # being retired, so it is covered as a cross-compile in `build` below
          # and by a real run only if an Intel runner is available.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.name }}
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # §17.6: platform smoke tests must run on real runners. They are marked
      # `#[ignore]` so a developer's `cargo test` stays hermetic and fast.
      - name: platform smoke tests
        run: cargo test --workspace --all-features -- --ignored --test-threads=1

  # §13 requires an explicit check that the workspace resolves exactly one
  # crossterm major version, because ratatui 0.30 selects it via a feature and a
  # mismatch produces confusing type errors rather than a clear failure.
  crossterm-version:
    name: single crossterm version
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: cargo tree -p crossterm
        run: cargo tree -p crossterm --workspace || true
      - name: exactly one crossterm version must resolve
        run: |
          versions=$(cargo metadata --format-version 1 --all-features \
            | python3 .github/scripts/crate_versions.py crossterm)
          echo "resolved crossterm versions: ${versions}"
          count=$(echo "${versions}" | wc -w | tr -d ' ')
          if [ "${count}" -ne 1 ]; then
            echo "::error::expected exactly one crossterm version, resolved ${count}: ${versions}"
            exit 1
          fi

  msrv:
    name: MSRV
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # RUSTUP_TOOLCHAIN takes precedence over rust-toolchain.toml, which pins
    # `stable` for development. Without this the job would silently test stable.
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv
      - name: verify the declared rust-version is the real one
        run: |
          rustc --version
          cargo check --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  build:
    name: build ${{ matrix.target }}
    needs: fmt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # Tier 2, best-effort static binary (§4).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: build-${{ matrix.target }}
      - name: install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}

  deny:
    name: cargo-deny
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # §18.2: deny unused dependencies. Runs on nightly because `cargo udeps`
  # requires it, and is advisory rather than blocking for that reason.
  unused-deps:
    name: unused dependencies (advisory)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets --all-features

  # B2 of the 1.0.0 design (docs/superpowers/specs/2026-07-31-road-to-1.0.0-design.md):
  # compares the workspace's public API against the last published release and
  # fails on a breaking change that was not paired with a major bump. `monitrs`
  # itself is a `[[bin]]` crate with no library target, so `--workspace` only ever
  # checks `monitrs-core`, `monitrs-collectors` and `monitrs-tui` — exactly the
  # three crates CONTRIBUTING.md's freeze policy names as API.
  # Answers "does this release need the twelve-hour soak?" from the files changed
  # since the last tag. It reports rather than blocks, because CI cannot know whether
  # a human actually ran the soak — the point is that the question gets answered
  # mechanically once per release instead of argued each time, and that the answer is
  # visible on the run page rather than in a log nobody opens.
  soak-scope:
    name: soak required?
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script diffs against the last tag, so a shallow clone with no tags
          # would silently compare against nothing and always answer "not required".
          fetch-depth: 0
          fetch-tags: true
      - name: verdict
        run: |
          set -euo pipefail
          base="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "No tag to compare against; treating the soak as required." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Soak scope"
            echo
            echo "Comparing \`$base\` to \`${GITHUB_SHA::12}\`."
            echo
            echo '```'
            python3 .github/scripts/soak_required.py "$base" "$GITHUB_SHA"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  semver:
    name: semver compatibility
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Installed from source rather than through a pinned third-party action:
      # unlike cargo-deny and cargo-udeps above, nothing in this workflow already
      # depends on an install action that carries this tool, and this repository
      # would rather pay the build time than add a new pinned dependency for it.
      - name: install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: public API must not break without a major bump
        run: cargo semver-checks check-release --workspace
