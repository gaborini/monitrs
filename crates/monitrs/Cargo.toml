[package]
name = "monitrs"
description = "A fast, keyboard-first system cockpit for Linux and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "monitrs"
path = "src/main.rs"

[dependencies]
monitrs-core = { workspace = true, features = ["serde"] }
monitrs-collectors.workspace = true
monitrs-tui.workspace = true

clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
color-eyre.workspace = true
crossbeam-channel.workspace = true
crossterm.workspace = true
directories.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
# Read for the self-overhead measurement only: one single-process refresh of our
# own PID (§26). The same crate the common collector uses, so measuring ourselves
# adds no second platform path and no unsafe code to this crate.
sysinfo.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
# §13's sanctioned logging stack, used by `logging.rs`. `tracing-appender` is here
# for its non-blocking writer: a log write that blocked on a slow disk would show
# up as collector lag, i.e. the tool would distort what it measures (§14.2, §16.2).
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion.workspace = true

# The reference workload of §16.1 and §16.3's benchmark list. Lives here rather
# than in monitrs-core because realistic input comes from the fake collector, and
# monitrs-core must not depend on the collectors even for dev (§10.1).
[[bench]]
name = "pipeline"
harness = false

[features]
default = ["linux-native", "macos-native"]
linux-native = ["monitrs-collectors/linux-native"]
macos-native = ["monitrs-collectors/macos-native"]

[lints]
workspace = true
